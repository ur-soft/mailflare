services:
  mailflare:
    build: .
    image: mailflare:local
    restart: unless-stopped
    ports:
      - "25:25"       # inbound SMTP (point your domain's MX here)
    env_file: .env
    depends_on:
        db:
          condition: service_healthy
    volumes:
      - mailflare-data:/data

  db:
    image: postgres:17
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB}"
    volumes:
      - mailflare-db:/var/lib/postgresql/data

volumes:
  mailflare-data:
  mailflare-db:
